<!DOCTYPE html>
<head>
    <title>Iframe Example with srcdoc</title>
</head>
<body>
    <h1>Iframe with src Example</h1>
    <iframe src="https://www.kodnest.com/" 
            height="300px" 
            width="500px" 
            frameborder="2" 
            scrolling="yes">
    </iframe>

    <h1>Iframe with srcdoc Example</h1>
    <iframe srcdoc='<h1>Front end classes on going</h1><br>
        <p><a href="https://www.kodnest.com/" target="iframe2">
            In A1 classroom at Kodnest click here</a></p>'
        height="300" 
        width="500"
        name="iframe1">
        </iframe>
        <iframe srcdoc='<h1>Front end classes on going</h1><br>'
        height="300" 
        width="500"
        name="iframe2">
    </iframe>
</body>
</html>
